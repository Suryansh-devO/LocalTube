<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LocalTube</title>

    <style>
        
/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0f0f0f;
    color: white;
}


/* ================= HEADER ================= */

.header {
    height: 65px;

    display: flex;
    align-items: center;

    padding: 0 25px;

    background: #0f0f0f;

    border-bottom: 1px solid #272727;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    z-index: 100;
}


/* LOGO */

.logo {
    width: 210px;

    display: flex;
    align-items: center;

    gap: 8px;

    font-size: 22px;
    font-weight: bold;
}

.play-icon {
    background: red;

    padding: 5px 8px;

    border-radius: 7px;

    font-size: 15px;
}


/* SEARCH */

.search-box {
    flex: 1;

    max-width: 600px;

    margin: auto;

    display: flex;
}

.search-box input {

    width: 100%;

    height: 40px;

    background: #121212;

    border: 1px solid #444;

    border-radius: 22px 0 0 22px;

    color: white;

    padding: 0 18px;

    font-size: 15px;

    outline: none;
}

.search-box input:focus {
    border-color: #3ea6ff;
}

.search-box button {

    width: 60px;

    border: 1px solid #444;

    border-left: none;

    background: #222;

    color: white;

    border-radius: 0 22px 22px 0;

    cursor: pointer;

    font-size: 17px;
}


/* FOLDER BUTTON */

.folder-btn {

    background: #272727;

    color: white;

    border: none;

    padding: 10px 18px;

    border-radius: 20px;

    cursor: pointer;

    font-size: 14px;
}

.folder-btn:hover {
    background: #3a3a3a;
}


/* ================= SIDEBAR ================= */

.sidebar {

    position: fixed;

    top: 65px;
    left: 0;
    bottom: 0;

    width: 220px;

    background: #0f0f0f;

    padding: 20px 10px;

    border-right: 1px solid #222;
}

.side-item {

    display: flex;

    align-items: center;

    gap: 20px;

    padding: 13px 18px;

    border-radius: 10px;

    margin-bottom: 5px;

    cursor: pointer;

    font-size: 15px;
}

.side-item:hover {
    background: #272727;
}

.side-item.active {
    background: #272727;
    font-weight: bold;
}


/* ================= MAIN ================= */

.main {

    margin-left: 220px;

    padding: 95px 30px 30px;

}


/* TOP SECTION */

.top-section {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 25px;
}

.top-section h2 {
    font-size: 22px;
}


/* FILTER */

.filter-buttons {

    display: flex;

    gap: 8px;
}

.filter {

    background: #272727;

    border: none;

    color: white;

    padding: 8px 16px;

    border-radius: 8px;

    cursor: pointer;
}

.filter:hover {
    background: #3a3a3a;
}

.filter.active {
    background: white;
    color: black;
}


/* ================= MEDIA GRID ================= */

.media-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(240px, 1fr));

    gap: 25px 18px;
}


/* CARD */

.media-card {

    cursor: pointer;

    min-width: 0;
}

.thumbnail {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #222;

    border-radius: 10px;

    overflow: hidden;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;
}

.thumbnail img,
.thumbnail video {

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* VIDEO ICON */

.video-icon {

    position: absolute;

    left: 10px;
    bottom: 10px;

    background: rgba(0,0,0,0.75);

    padding: 6px 9px;

    border-radius: 5px;

    font-size: 14px;
}


/* IMAGE ICON */

.image-icon {

    position: absolute;

    left: 10px;
    bottom: 10px;

    background: rgba(0,0,0,0.75);

    padding: 6px 9px;

    border-radius: 5px;
}


/* CARD TITLE */

.media-title {

    margin-top: 10px;

    font-size: 15px;

    line-height: 20px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.media-info {

    color: #aaa;

    font-size: 13px;

    margin-top: 5px;
}


/* ================= EMPTY ================= */

.empty-message {

    grid-column: 1 / -1;

    text-align: center;

    margin-top: 100px;

    color: #aaa;
}

.empty-icon {
    font-size: 60px;
    margin-bottom: 20px;
}

.empty-message h2 {
    color: white;
    margin-bottom: 10px;
}

.empty-message p {
    margin-bottom: 20px;
}

.empty-message button {

    background: white;

    border: none;

    padding: 12px 20px;

    border-radius: 20px;

    cursor: pointer;

    font-weight: bold;
}


/* ================= WATCH PAGE ================= */

.modal {

    position: fixed;

    inset: 0;

    background: #0f0f0f;

    display: none;

    z-index: 1000;

    overflow-y: auto;
}

.modal.show {
    display: block;
}


/* ================= WATCH LAYOUT ================= */

/* Main watch page: video on the left, recommendations on the right */
.watch-page {
    width: min(1400px, calc(100% - 40px));
    margin: 0 auto;
    padding: 25px 0 40px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    column-gap: 20px;
    align-items: start;
}

/* Header spans the complete watch page */
.watch-header {
    grid-column: 1 / -1;
}

/* Keyboard guide on the home/watch area can span the full width */
.watch-page > .keyboard-guide {
    grid-column: 1 / -1;
}

/* Main video stays in the left column */
.watch-main {
    grid-column: 1;
    min-width: 0;
    width: 100%;
}

/* Recommendations stay beside the video */
.recommendations {
    grid-column: 2;
    grid-row: 2 / span 2;
}

/* More media stays below the complete player + recommendation area */
.watch-below {
    grid-column: 1 / -1;
}

/* ================= MAIN VIDEO ================= */

.watch-main {

    position: relative;

    min-width: 0;
    width: 100%;
}

.main-video {

    width: 100%;

    background: black;

    border-radius: 10px;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 400px;
}


.main-video video {

    width: 100%;

    max-height: 75vh;

    display: block;

    background: black;
}


.main-video img {

    max-width: 100%;

    max-height: 75vh;

    display: none;

    object-fit: contain;
}


/* ================= VIDEO TITLE ================= */

#playerTitle {

    font-size: 20px;

    margin-top: 15px;

    color: white;

    word-break: break-word;
}


/* ================= CLOSE BUTTON ================= */

.close-btn {

    position: fixed;

    top: 20px;

    right: 25px;

    width: 42px;

    height: 42px;

    border: none;

    border-radius: 50%;

    background: #272727;

    color: white;

    font-size: 18px;

    cursor: pointer;

    z-index: 1100;
}

.close-btn:hover {

    background: #444;
}


/* ================= RECOMMENDATIONS ================= */

.recommendations {
    width: 100%;
    min-width: 0;
    padding: 0;
    margin: 0;
    max-height: none;
    overflow: visible;
}

.recommendations h2 {
    margin: 0 0 15px 0;
    font-size: 20px;
    font-weight: 600;
}

/* Recommendation list */
#recommendationList {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

/* Recommendation card */
.recommendation-card {
    display: grid;
    grid-template-columns: 145px minmax(0, 1fr);
    gap: 10px;
    width: 100%;
    margin: 0;
    cursor: pointer;
    min-width: 0;
}

/* Thumbnail */
.recommendation-thumbnail {
    width: 145px;
    height: 82px;
    background: #222;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
}

.recommendation-thumbnail img,
.recommendation-thumbnail video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Text */
.recommendation-info {
    min-width: 0;
    overflow: hidden;
}

.recommendation-title {
    font-size: 14px;
    line-height: 19px;
    font-weight: 500;
    color: #eee;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.recommendation-size {
    color: #aaa;
    font-size: 12px;
    margin-top: 5px;
}

.recommendation-card:hover .recommendation-title {
    color: #3ea6ff;
}

/* ================= HOVER PREVIEW ================= */

.thumbnail video.preview-video {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


/* Small play indicator */

.preview-play {

    position: absolute;

    right: 8px;

    bottom: 8px;

    background: rgba(0, 0, 0, 0.75);

    padding: 5px 8px;

    border-radius: 5px;

    font-size: 12px;

    pointer-events: none;
}


/* ================= WATCH PAGE RESPONSIVE ================= */

@media (max-width: 1000px) {

    .watch-page {
        grid-template-columns: 1fr;
        width: min(100% - 30px, 900px);
    }

    .watch-main {
        grid-column: 1;
    }

    .recommendations {
        grid-column: 1;
        grid-row: auto;
        margin-top: 20px;
    }

    .recommendation-card {
        grid-template-columns: 180px minmax(0, 1fr);
    }

    .recommendation-thumbnail {
        width: 180px;
        height: 100px;
    }
}

@media (max-width: 600px) {

    .watch-page {
        width: 100%;
        padding: 15px 0 30px;
    }

    .main-video {
        border-radius: 0;
        min-height: 250px;
    }

    #playerTitle {
        padding: 0 15px;
        font-size: 17px;
    }

    .recommendations {
        padding: 15px;
    }

    .recommendation-card {
        grid-template-columns: 130px minmax(0, 1fr);
    }

    .recommendation-thumbnail {
        width: 130px;
        height: 73px;
    }
}

/* ================= RESPONSIVE ================= */

@media (max-width: 800px) {

    .sidebar {
        width: 70px;
    }

    .side-item span {
        display: none;
    }

    .side-item {
        justify-content: center;
        padding: 15px;
    }

    .main {
        margin-left: 70px;
    }

    .logo {
        width: auto;
        margin-right: 15px;
    }

    .logo span:last-child {
        display: none;
    }

    .folder-btn {
        padding: 9px;
        font-size: 0;
    }

    .folder-btn::after {
        content: "📁";
        font-size: 18px;
    }
}

/* ==========================================
   MEDIA PREVIOUS / NEXT BUTTONS
   ========================================== */

.media-nav {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 55px;

    height: 80px;

    border: none;

    background: rgba(0, 0, 0, 0.55);

    color: white;

    font-size: 42px;

    cursor: pointer;

    z-index: 20;

    opacity: 0;

    transition: 0.2s;

}


/* Show arrows when mouse is over player */

.main-video:hover .media-nav {

    opacity: 1;

}


/* Previous */

.media-nav.previous {

    left: 0;

    border-radius: 0 12px 12px 0;

}


/* Next */

.media-nav.next {

    right: 0;

    border-radius: 12px 0 0 12px;

}


/* Hover */

.media-nav:hover {

    background: rgba(0, 0, 0, 0.8);

}


/* ==========================================
   MEDIA DETAILS
   ========================================== */

.media-details {

    display: flex;

    gap: 20px;

    margin-top: 12px;

    color: #aaa;

    font-size: 14px;

}


/* Keyboard hint */

.media-details::after {

    content: "← →  Previous / Next";

    margin-left: auto;

    color: #777;


}


/* ==========================================
   MORE MEDIA BELOW PLAYER
   ========================================== */

.watch-below {

    grid-column: 1 / -1;

    margin-top: 20px;

    border-top: 1px solid #272727;

    padding-top: 25px;

}


.watch-below h2 {

    font-size: 20px;

    margin-bottom: 18px;

}


/* ==========================================
   BELOW MEDIA GRID
   ========================================== */

.below-media-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 22px 16px;

}


/* Card */

.below-media-card {

    cursor: pointer;

    min-width: 0;

}


/* Thumbnail */

.below-media-thumbnail {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #222;

    border-radius: 9px;

    overflow: hidden;

}


.below-media-thumbnail img,
.below-media-thumbnail video {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* Title */

.below-media-title {

    margin-top: 9px;

    font-size: 14px;

    line-height: 19px;

    font-weight: 500;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* Info */

.below-media-info {

    margin-top: 5px;

    color: #aaa;

    font-size: 12px;

}


/* Hover */

.below-media-card:hover
.below-media-title {

    color: #3ea6ff;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 700px) {

    .below-media-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}/* ==========================================
   MORE MEDIA BELOW PLAYER
   ========================================== */

.watch-below {

    grid-column: 1 / -1;

    margin-top: 20px;

    border-top: 1px solid #272727;

    padding-top: 25px;

}


.watch-below h2 {

    font-size: 20px;

    margin-bottom: 18px;

}


/* ==========================================
   BELOW MEDIA GRID
   ========================================== */

.below-media-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 22px 16px;

}


/* Card */

.below-media-card {

    cursor: pointer;

    min-width: 0;

}


/* Thumbnail */

.below-media-thumbnail {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #222;

    border-radius: 9px;

    overflow: hidden;

}


.below-media-thumbnail img,
.below-media-thumbnail video {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* Title */

.below-media-title {

    margin-top: 9px;

    font-size: 14px;

    line-height: 19px;

    font-weight: 500;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* Info */

.below-media-info {

    margin-top: 5px;

    color: #aaa;

    font-size: 12px;

}


/* Hover */

.below-media-card:hover
.below-media-title {

    color: #3ea6ff;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 700px) {

    .below-media-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

/* ==========================================
   WATCH PAGE HEADER
   ========================================== */

.watch-header {

    grid-column: 1 / -1;

    height: 55px;

    display: flex;

    align-items: center;

    margin-bottom: 5px;

}


/* LocalTube logo button */

.watch-logo {

    display: flex;

    align-items: center;

    gap: 8px;

    background: transparent;

    border: none;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    padding: 5px 10px;

    border-radius: 8px;

}


.watch-logo:hover {

    background: #272727;

}


/* Logo play icon */

.watch-logo .play-icon {

    background: red;

    padding: 5px 8px;

    border-radius: 7px;

    font-size: 14px;

}

/* ==========================================
   WELCOME SCREEN
   ========================================== */

.welcome-screen {

    position: fixed;

    inset: 0;

    background: #0f0f0f;

    z-index: 5000;

    overflow-y: auto;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 40px 20px;

}


/* Welcome box */

.welcome-box {

    width: 100%;

    max-width: 950px;

    text-align: center;

}


/* Logo */

.welcome-logo {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 9px;

    font-size: 28px;

    font-weight: bold;

    margin-bottom: 25px;

}


.welcome-logo .play-icon {

    background: red;

    padding: 7px 11px;

    border-radius: 8px;

    font-size: 18px;

}


/* Heading */

.welcome-box h1 {

    font-size: 34px;

    margin-bottom: 10px;

}


.welcome-subtitle {

    color: #aaa;

    font-size: 17px;

    margin-bottom: 35px;

}


/* ==========================================
   MANUAL CARDS
   ========================================== */

.manual-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    text-align: left;

}


.manual-card {

    background: #181818;

    border: 1px solid #292929;

    border-radius: 12px;

    padding: 20px;

    transition: 0.2s;

}


.manual-card:hover {

    background: #222;

    transform: translateY(-2px);

}


.manual-icon {

    font-size: 30px;

    margin-bottom: 12px;

}


.manual-card h3 {

    font-size: 16px;

    margin-bottom: 8px;

}


.manual-card p {

    color: #aaa;

    font-size: 13px;

    line-height: 19px;

}


/* ==========================================
   START BUTTON
   ========================================== */

.start-button {

    margin-top: 30px;

    background: white;

    color: black;

    border: none;

    padding: 13px 24px;

    border-radius: 25px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.start-button:hover {

    background: #ddd;

}


/* ==========================================
   WELCOME RESPONSIVE
   ========================================== */

@media (max-width: 800px) {

    .manual-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media (max-width: 500px) {

    .manual-grid {

        grid-template-columns: 1fr;

    }


    .welcome-box h1 {

        font-size: 26px;

    }

}

/* ==========================================
   KEYBOARD CONTROLS - TOP
   ========================================== */

.keyboard-guide {

    grid-column: 1 / -1;

    width: 100%;

    margin: 0 0 12px 0;

    padding: 8px 0;

    display: flex;

    align-items: center;

    gap: 18px;

}


/* Heading */

.keyboard-guide h3 {

    margin: 0;

    white-space: nowrap;

    font-size: 14px;

    color: #ddd;

}


/* Controls */

.keyboard-controls {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

}


/* Individual control */

.key-control {

    display: flex;

    align-items: center;

    gap: 6px;

    background: #181818;

    border: 1px solid #292929;

    padding: 5px 8px;

    border-radius: 6px;

    color: #aaa;

    font-size: 11px;

}


/* Keyboard key */

.key-control kbd {

    background: #303030;

    border: 1px solid #555;

    color: white;

    padding: 3px 6px;

    border-radius: 4px;

    font-family: Arial, sans-serif;

    font-size: 11px;

    font-weight: bold;

    box-shadow: 0 1px 0 #111;

}

/* ==========================================
   HOME EMPTY AREA
   ========================================== */

.empty-message {

    width: 100%;

    min-height: 500px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 80px;

    padding: 40px;

    box-sizing: border-box;

}


/* ==========================================
   FOLDER SELECT AREA
   ========================================== */

.folder-empty-area {

    width: 480px;

    text-align: center;

}


.folder-empty-area .empty-icon {

    font-size: 70px;

    margin-bottom: 20px;

}


.folder-empty-area h2 {

    font-size: 28px;

    margin-bottom: 12px;

}


.folder-empty-area p {

    color: #aaa;

    font-size: 16px;

    line-height: 24px;

    margin-bottom: 25px;

}


.folder-empty-area button {

    background: white;

    color: black;

    border: none;

    padding: 14px 25px;

    border-radius: 25px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.folder-empty-area button:hover {

    background: #ddd;

}


/* ==========================================
   HOME KEYBOARD MANUAL
   ========================================== */

.home-keyboard-guide {

    width: 300px;

    background: #181818;

    border: 1px solid #292929;

    border-radius: 12px;

    padding: 22px;

    box-sizing: border-box;

}


.home-keyboard-guide h3 {

    margin: 0 0 18px 0;

    font-size: 18px;

    color: white;

}


/* List */

.home-key-list {

    display: flex;

    flex-direction: column;

    gap: 10px;

}


/* Each key */

.home-key-item {

    display: flex;

    align-items: center;

    gap: 12px;

    color: #aaa;

    font-size: 14px;

}


/* Keyboard button */

.home-key-item kbd {

    min-width: 55px;

    text-align: center;

    background: #303030;

    border: 1px solid #555;

    color: white;

    padding: 6px 8px;

    border-radius: 5px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    font-weight: bold;

    box-shadow: 0 2px 0 #111;

}


/* ==========================================
   RESPONSIVE
   ========================================== */

@media (max-width: 900px) {

    .empty-message {

        flex-direction: column;

        gap: 35px;

    }


    .folder-empty-area {

        width: 100%;

        max-width: 480px;

    }


    .home-keyboard-guide {

        width: 100%;

        max-width: 480px;

    }

}

/* ================= FINAL WATCH LAYOUT OVERRIDES ================= */

.watch-header {
    grid-column: 1 / -1;
}

.watch-page > .watch-main {
    grid-column: 1;
}

    <script>
        // ==========================================
// GET HTML ELEMENTS
// ==========================================

const folderBtn = document.getElementById("folderBtn");
const folderInput = document.getElementById("folderInput");
const selectFolderEmpty = document.getElementById("selectFolderEmpty");

const mediaGrid = document.getElementById("mediaGrid");

const searchInput = document.getElementById("searchInput");

const playerModal = document.getElementById("playerModal");

const videoPlayer = document.getElementById("videoPlayer");

const imageViewer = document.getElementById("imageViewer");

const playerTitle = document.getElementById("playerTitle");

const closePlayer = document.getElementById("closePlayer");

const recommendationList =
    document.getElementById("recommendationList");
    const belowMediaGrid =
    document.getElementById("belowMediaGrid");
    
    const previousMedia =
    document.getElementById("previousMedia");

const nextMedia =
    document.getElementById("nextMedia");

const mediaType =
    document.getElementById("mediaType");

const mediaSize =
    document.getElementById("mediaSize");

    const watchHomeBtn =
    document.getElementById("watchHomeBtn");


// Currently playing file

let currentMediaFile = null;


// ==========================================
// MEDIA DATA
// ==========================================

let mediaFiles = [];

let currentFilter = "all";


// ==========================================
// OPEN FOLDER PICKER
// ==========================================

folderBtn.addEventListener("click", function () {

    folderInput.click();

});


selectFolderEmpty.addEventListener("click", function () {

    folderInput.click();

});


// ==========================================
// FOLDER SELECTED
// ==========================================

folderInput.addEventListener("change", function (event) {

    const files = Array.from(event.target.files);


    mediaFiles = files.filter(function (file) {

        return (
            file.type.startsWith("video/") ||
            file.type.startsWith("image/")
        );

    });


    console.log("Media files:", mediaFiles);


    showMedia();

});


// ==========================================
// SHOW MEDIA
// ==========================================

function showMedia() {

    mediaGrid.innerHTML = "";


    let filteredFiles =
        mediaFiles.filter(function (file) {


            if (currentFilter === "video") {

                return file.type.startsWith("video/");

            }


            if (currentFilter === "image") {

                return file.type.startsWith("image/");

            }


            return true;

        });


    // ======================================
    // SEARCH
    // ======================================

    const searchText =
        searchInput.value.toLowerCase().trim();


    if (searchText !== "") {

        filteredFiles =
            filteredFiles.filter(function (file) {

                return file.name
                    .toLowerCase()
                    .includes(searchText);

            });

    }


    // ======================================
    // NO MEDIA
    // ======================================

    if (filteredFiles.length === 0) {

        mediaGrid.innerHTML = `
            <div class="empty-message">

                <div class="empty-icon">
                    😕
                </div>

                <h2>No media found</h2>

                <p>
                    Try another search or select another folder.
                </p>

            </div>
        `;

        return;

    }


    // ======================================
    // CREATE CARDS
    // ======================================

    filteredFiles.forEach(function (file) {

        createMediaCard(file);

    });

}


// ==========================================
// CREATE MEDIA CARD
// ==========================================

function createMediaCard(file) {

    const card =
        document.createElement("div");

    card.className = "media-card";


    const thumbnail =
        document.createElement("div");

    thumbnail.className = "thumbnail";


    const url =
        URL.createObjectURL(file);


    // ======================================
    // VIDEO
    // ======================================

    if (file.type.startsWith("video/")) {

        const video =
            document.createElement("video");


        video.src = url;

        video.muted = true;

        video.playsInline = true;

        video.preload = "metadata";


        video.className = "preview-video";


        thumbnail.appendChild(video);


        // Preview label
        const icon =
            document.createElement("div");

        icon.className = "preview-play";

        icon.innerText = "▶ Preview";

        thumbnail.appendChild(icon);


        // ==================================
        // MOUSE ENTER
        // ==================================

        card.addEventListener("mouseenter", function () {

            // Start from beginning
            video.currentTime = 0;


            video.play().catch(function () {

                // Browser autoplay restriction
                console.log("Preview autoplay blocked");

            });

        });


        // ==================================
        // MOUSE LEAVE
        // ==================================

        card.addEventListener("mouseleave", function () {

            video.pause();

            video.currentTime = 0;

        });

    }


    // ======================================
    // IMAGE
    // ======================================

    else {

        const image =
            document.createElement("img");


        image.src = url;

        image.alt = file.name;


        thumbnail.appendChild(image);


        const icon =
            document.createElement("div");


        icon.className = "image-icon";

        icon.innerText = "🖼 Image";


        thumbnail.appendChild(icon);

    }


    // ======================================
    // TITLE
    // ======================================

    const title =
        document.createElement("div");


    title.className = "media-title";

    title.innerText = file.name;


    // ======================================
    // FILE SIZE
    // ======================================

    const info =
        document.createElement("div");


    info.className = "media-info";


    const sizeMB =
        (file.size / (1024 * 1024)).toFixed(1);


    info.innerText =
        sizeMB + " MB";


    // ======================================
    // ADD TO CARD
    // ======================================

    card.appendChild(thumbnail);

    card.appendChild(title);

    card.appendChild(info);


    // ======================================
    // OPEN VIDEO
    // ======================================

    card.addEventListener("click", function () {

        openMedia(file);
        

    });


    mediaGrid.appendChild(card);

}


// ==========================================
// OPEN MEDIA
// ==========================================

function openMedia(file) {

    currentMediaFile = file;


    const url =
        URL.createObjectURL(file);


    playerModal.classList.add("show");


    // File name

    playerTitle.innerText =
        file.name;


    // File size

    const sizeMB =
        (file.size / (1024 * 1024)).toFixed(1);


    mediaSize.innerText =
        sizeMB + " MB";


    // ======================================
    // VIDEO
    // ======================================

    if (file.type.startsWith("video/")) {

        mediaType.innerText =
            "🎬 Video";


        imageViewer.style.display =
            "none";


        videoPlayer.style.display =
            "block";


        videoPlayer.src =
            url;


        videoPlayer.muted =
            false;


        videoPlayer.play();


    }


    // ======================================
    // IMAGE
    // ======================================

    else {

        mediaType.innerText =
            "🖼 Image";


        videoPlayer.pause();


        videoPlayer.removeAttribute("src");


        videoPlayer.style.display =
            "none";


        imageViewer.style.display =
            "block";


        imageViewer.src =
            url;

    }


    // ======================================
    // RECOMMENDATIONS
    // ======================================

    showRecommendations(file);
    showMoreMedia(file);

}


// ==========================================
// RECOMMENDATIONS
// ==========================================

function showRecommendations(currentFile) {

    recommendationList.innerHTML = "";


    // Current video ko recommendation mein nahi dikhana
    const recommendations =
        mediaFiles.filter(function (file) {

            return file !== currentFile;

        });


    // Maximum 10 recommendations
    const limited =
        recommendations.slice(0, 10);


    limited.forEach(function (file) {

        createRecommendation(file);

    });


    if (limited.length === 0) {

        recommendationList.innerHTML = `
            <p style="color:#aaa;">
                No more media available.
            </p>
        `;

    }

}


// ==========================================
// CREATE RECOMMENDATION
// ==========================================

function createRecommendation(file) {

    const card =
        document.createElement("div");


    card.className =
        "recommendation-card";


    const thumbnail =
        document.createElement("div");


    thumbnail.className =
        "recommendation-thumbnail";


    const url =
        URL.createObjectURL(file);


    // ======================================
    // VIDEO
    // ======================================
if (file.type.startsWith("video/")) {

    const video =
        document.createElement("video");

    video.src = url;

    video.muted = true;

    video.playsInline = true;

    video.preload = "metadata";

    video.setAttribute("webkit-playsinline", "");

    thumbnail.appendChild(video);


    // ==============================
    // HOVER PREVIEW START
    // ==============================

    card.addEventListener("mouseenter", function () {

        video.currentTime = 0;

        video.play().catch(function () {

            console.log("Recommendation preview blocked");

        });

    });


    // ==============================
    // HOVER PREVIEW STOP
    // ==============================

    card.addEventListener("mouseleave", function () {

        video.pause();

        video.currentTime = 0;

    });

}


    // ======================================
    // IMAGE
    // ======================================

    else {

        const image =
            document.createElement("img");


        image.src = url;

        image.alt = file.name;


        thumbnail.appendChild(image);

    }


    // ======================================
    // INFO
    // ======================================

    const info =
        document.createElement("div");


    info.className =
        "recommendation-info";


    const title =
        document.createElement("div");


    title.className =
        "recommendation-title";


    title.innerText =
        file.name;


    const size =
        document.createElement("div");


    size.className =
        "recommendation-size";


    const sizeMB =
        (file.size / (1024 * 1024)).toFixed(1);


    size.innerText =
        sizeMB + " MB";


    info.appendChild(title);

    info.appendChild(size);


    // ======================================
    // ADD TO CARD
    // ======================================

    card.appendChild(thumbnail);

    card.appendChild(info);


    // ======================================
    // CLICK RECOMMENDATION
    // ======================================

    card.addEventListener("click", function () {

        openMedia(file);

    });


    recommendationList.appendChild(card);

}


// ==========================================
// CLOSE PLAYER
// ==========================================

closePlayer.addEventListener("click", function () {

    closePlayerWindow();

});


function closePlayerWindow() {

    videoPlayer.pause();

    videoPlayer.removeAttribute("src");

    imageViewer.removeAttribute("src");

    playerModal.classList.remove("show");

}


// ==========================================
// CLICK OUTSIDE
// ==========================================

playerModal.addEventListener("click", function (event) {

    if (event.target === playerModal) {

        closePlayerWindow();

    }

});


// ==========================================
// SEARCH

searchInput.addEventListener("input", function () {

});


// ==========================================
// FILTER BUTTONS

const filters =

filters.forEach(function (button) {

// ==========================================
// UPDATE FILTER BUTTONS
// ==========================================

function updateFilterButtons() {

    filters.forEach(function (button) {

        button.classList.remove("active");


        if (
            button.dataset.filter === currentFilter
        ) {

            button.classList.add("active");

        }

    });

}
// ==========================================
// GET PREVIOUS / NEXT MEDIA
// ==========================================

function getSameTypeMedia() {

    if (!currentMediaFile) {

        return [];

    }


    // If current media is video
    if (
        currentMediaFile.type.startsWith("video/")
    ) {

        return mediaFiles.filter(function (file) {

            return file.type.startsWith("video/");

        });

    }


    // If current media is image
    return mediaFiles.filter(function (file) {

        return file.type.startsWith("image/");

    });

}


// ==========================================
// NEXT MEDIA
// ==========================================

function nextMediaFile() {

    const list =
        getSameTypeMedia();


    if (list.length === 0) {

        return;

    }


    const currentIndex =
        list.indexOf(currentMediaFile);


    let nextIndex =
        currentIndex + 1;


    // If last file → first file
    if (nextIndex >= list.length) {

        nextIndex = 0;

    }


    openMedia(list[nextIndex]);

}


// ==========================================
// PREVIOUS MEDIA
// ==========================================

function previousMediaFile() {

    const list =
        getSameTypeMedia();


    if (list.length === 0) {

        return;

    }


    const currentIndex =
        list.indexOf(currentMediaFile);


    let previousIndex =
        currentIndex - 1;


    // If first file → last file
    if (previousIndex < 0) {

        previousIndex =
            list.length - 1;

    }


    openMedia(list[previousIndex]);

}


// ==========================================
// NEXT BUTTON
// ==========================================

nextMedia.addEventListener(
    "click",
    function () {

        nextMediaFile();

    }
);


// ==========================================
// PREVIOUS BUTTON
// ==========================================

previousMedia.addEventListener(
    "click",
    function () {

        previousMediaFile();

    }
);

// ==========================================
// KEYBOARD CONTROLS
// ==========================================

document.addEventListener(
    "keydown",
    function (event) {


        // Player open nahi hai
        if (
            !playerModal.classList.contains("show")
        ) {

            return;

        }


        // ==================================
        // INPUT / SEARCH ME TYPE KAR RAHE HO
        // ==================================

        if (
            event.target.tagName === "INPUT" ||
            event.target.tagName === "TEXTAREA"
        ) {

            return;

        }


        // ==================================
        // SPACE = PLAY / PAUSE
        // ==================================

        if (event.code === "Space") {

            // Sirf video ke liye
            if (
                currentMediaFile &&
                currentMediaFile.type.startsWith("video/")
            ) {

                event.preventDefault();


                if (videoPlayer.paused) {

                    videoPlayer.play();

                } else {

                    videoPlayer.pause();

                }

            }

        }


        // ==================================
        // J = 10 SEC BACKWARD
        // ==================================

        else if (
            event.key.toLowerCase() === "j"
        ) {

            if (
                currentMediaFile &&
                currentMediaFile.type.startsWith("video/")
            ) {

                videoPlayer.currentTime =
                    Math.max(
                        0,
                        videoPlayer.currentTime - 10
                    );

            }

        }


        // ==================================
        // L = 10 SEC FORWARD
        // ==================================

        else if (
            event.key.toLowerCase() === "l"
        ) {

            if (
                currentMediaFile &&
                currentMediaFile.type.startsWith("video/")
            ) {

                videoPlayer.currentTime =
                    Math.min(
                        videoPlayer.duration || Infinity,
                        videoPlayer.currentTime + 10
                    );

            }

        }


        // ==================================
        // LEFT ARROW = PREVIOUS
        // ==================================

        else if (event.key === "ArrowLeft") {

            previousMediaFile();

        }


        // ==================================
        // RIGHT ARROW = NEXT
        // ==================================

        else if (event.key === "ArrowRight") {

            nextMediaFile();

        }
        // ==================================
// F = FULLSCREEN TOGGLE
// ==================================

else if (event.key.toLowerCase() === "f") {

    event.preventDefault();

    toggleFullscreen();

}

    }
);

// ==========================================
// MORE MEDIA BELOW PLAYER
// ==========================================

function showMoreMedia(currentFile) {

    belowMediaGrid.innerHTML = "";


    // Current file ko hata kar baaki media
    const otherFiles =

        });


    // Maximum 20 files

        otherFiles.slice(0, 20);

        createBelowMediaCard(file);

    });



}

watchHomeBtn.addEventListener(
    "click",

    }
);

// ==========================================
// FULLSCREEN TOGGLE
// ==========================================

function toggleFullscreen() {

    let fullscreenElement;


    // ==============================
    // VIDEO
    // ==============================

    if (
        currentMediaFile &&
        currentMediaFile.type.startsWith("video/")
    ) {

        fullscreenElement = videoPlayer;

    }


    // ==============================
    // IMAGE
    // ==============================

    else if (
        currentMediaFile &&
        currentMediaFile.type.startsWith("image/")
    ) {

        fullscreenElement = imageViewer;

    }


    // Koi media open nahi
    if (!fullscreenElement) {

        return;

    }


    // ==============================
    // FULLSCREEN ON
    // ==============================

    if (!document.fullscreenElement) {

        fullscreenElement
            .requestFullscreen()
            .catch(function (error) {

                console.log(
                    "Fullscreen error:",
                    error
                );

            });

    }


    // ==============================
    // FULLSCREEN OFF
    // ==============================

    else {

        document.exitFullscreen();

    }

}
